name: Publicar página da estação

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # de 10 em 10 minutos

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Recolher dados do Tejo (APA / SNIRH)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Endereço público atual da página (site de utilizador/organização ou de projeto)
          OWNER_LC=$(echo "$OWNER" | tr "[:upper:]" "[:lower:]"); REPO_LC=$(echo "$REPO" | tr "[:upper:]" "[:lower:]")
          if [ "$REPO_LC" = "$OWNER_LC.github.io" ]; then SITE="https://$REPO_LC"; else SITE="https://$OWNER_LC.github.io/$REPO"; fi
          PREVIOUS_URL="$SITE/data/tejo.json" node tools/tejo.mjs
      - name: Lista de imagens do radar do IPMA
        run: node tools/radar-ipma.mjs
      - name: Diagnóstico Ecowitt (temporário)
        continue-on-error: true
        run: |
          U="https://api.ecowitt.net/api/v3/device/real_time?application_key=CB3440D921EB4A773E0E5818ED5CF050&api_key=af5a5b03-2c2e-46d3-acfc-e21abc8137b8&mac=C8:85:41:0C:B7:4F&call_back=all&temp_unitid=1&pressure_unitid=3&wind_speed_unitid=7&rainfall_unitid=12"
          curl -s -m 20 -D hdr.txt -H "Origin: https://meteoalmeirim.github.io" "$U" -o rt.json
          grep -iE "^HTTP|access-control" hdr.txt | sed 's/^/ECODIAG /'
          echo "ECODIAG $(cat rt.json)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # O GitHub às vezes ainda não "vê" o pacote acabado de enviar; espera um pouco e tenta outra vez.
      - name: Aguardar antes de nova tentativa
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Publicar (2.ª tentativa)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
