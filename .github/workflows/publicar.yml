name: Publicar página da estação

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # de 10 em 10 minutos

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recolher dados do Tejo (APA / SNIRH)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Endereço público atual da página (site de utilizador/organização ou de projeto)
          OWNER_LC=$(echo "$OWNER" | tr "[:upper:]" "[:lower:]"); REPO_LC=$(echo "$REPO" | tr "[:upper:]" "[:lower:]")
          if [ "$REPO_LC" = "$OWNER_LC.github.io" ]; then SITE="https://$REPO_LC"; else SITE="https://$OWNER_LC.github.io/$REPO"; fi
          PREVIOUS_URL="$SITE/data/tejo.json" node tools/tejo.mjs
      - name: Lista de imagens do radar do IPMA
        run: node tools/radar-ipma.mjs
      - name: Diagnóstico Weather Underground (temporário)
        continue-on-error: true
        run: |
          K=$(grep -o 'KEY="[0-9a-f]*"' site/index.html | cut -d'"' -f2)
          for U in "observations/current?stationId=IALMEI2&format=json&units=m&numericPrecision=decimal" "observations/all/1day?stationId=IALMEI2&format=json&units=m&numericPrecision=decimal"; do
            echo "WUDIAG == $U"
            curl -s -m 20 -D - -o body.txt -H "Origin: https://meteoalmeirim.github.io" "https://api.weather.com/v2/pws/$U&apiKey=$K" | grep -iE "^HTTP|access-control|content-length" | sed 's/^/WUDIAG /'
            echo "WUDIAG body: $(head -c 400 body.txt)"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
