name: Publicar página da estação

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # de 10 em 10 minutos

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Recolher dados do Tejo (APA / SNIRH)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Endereço público atual da página (site de utilizador/organização ou de projeto)
          OWNER_LC=$(echo "$OWNER" | tr "[:upper:]" "[:lower:]"); REPO_LC=$(echo "$REPO" | tr "[:upper:]" "[:lower:]")
          if [ "$REPO_LC" = "$OWNER_LC.github.io" ]; then SITE="https://$REPO_LC"; else SITE="https://$OWNER_LC.github.io/$REPO"; fi
          PREVIOUS_URL="$SITE/data/tejo.json" node tools/tejo.mjs
      - name: Lista de imagens do radar do IPMA
        run: node tools/radar-ipma.mjs
      - name: Diagnóstico Ecowitt (temporário)
        continue-on-error: true
        run: |
          K="application_key=CB3440D921EB4A773E0E5818ED5CF050&api_key=af5a5b03-2c2e-46d3-acfc-e21abc8137b8&mac=C8:85:41:0C:B7:4F&temp_unitid=1&pressure_unitid=3&wind_speed_unitid=7&rainfall_unitid=12&solar_irradiance_unitid=16&lightning_unitid=1"
          curl -s -m 20 "https://api.ecowitt.net/api/v3/device/real_time?$K&call_back=all" -o rt.json
          echo "ECORT $(jq -c '.data|del(.lightning)' rt.json)"
          S=$(date -u -d '-24 hours' '+%Y-%m-%d %H:%M:%S'); E=$(date -u '+%Y-%m-%d %H:%M:%S')
          echo "ECOTZ server-now-utc $E"
          curl -s -m 30 -G -D hh.txt -H "Origin: https://meteoalmeirim.github.io" "https://api.ecowitt.net/api/v3/device/history?$K" --data-urlencode "start_date=$S" --data-urlencode "end_date=$E" --data-urlencode "cycle_type=5min" --data-urlencode "call_back=outdoor.temperature,outdoor.dew_point,wind.wind_speed,wind.wind_gust,pressure.relative,rainfall_piezo.daily,solar_and_uvi.solar,solar_and_uvi.uvi" -o hist.json
          grep -iE "^HTTP|access-control-allow-origin" hh.txt | sed 's/^/ECOHH /'
          echo "ECOHIST code $(jq -c '.code,.msg' hist.json)"
          echo "ECOHIST temp $(jq -c '.data.outdoor.temperature|{unit,n:(.list|length),first:(.list|to_entries|.[0:2]),last:(.list|to_entries|.[-2:])}' hist.json)"
          echo "ECOHIST rain $(jq -c '.data.rainfall_piezo.daily|{unit,n:(.list|length),last:(.list|to_entries|.[-2:])}' hist.json)"
          echo "ECOHIST keys $(jq -c '.data|to_entries|map({(.key):(.value|keys)})' hist.json)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # O GitHub às vezes ainda não "vê" o pacote acabado de enviar; espera um pouco e tenta outra vez.
      - name: Aguardar antes de nova tentativa
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Publicar (2.ª tentativa)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
