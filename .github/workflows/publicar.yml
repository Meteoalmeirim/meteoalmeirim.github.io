name: Publicar página da estação

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"   # de 30 em 30 minutos (hora UTC)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recolher dados do Tejo (APA / SNIRH)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Endereço público atual da página (site de utilizador/organização ou de projeto)
          if [ "$REPO" = "$OWNER.github.io" ]; then SITE="https://$REPO"; else SITE="https://$OWNER.github.io/$REPO"; fi
          PREVIOUS_URL="$SITE/data/tejo.json" node tools/tejo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
